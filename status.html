<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Print status | Robinson's 3D Printing Service</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="status">
  <header class="site-header"><a class="brand" href="index.html"><img src="icon.svg" alt="" width="42" height="42"><span>ROBINSON’S<span class="brand-sub">3D PRINTING SERVICE</span></span></a><a class="text-link" href="index.html">Check another order ↗</a></header>
  <main class="status-main">
    <a class="back-link" href="index.html">← Back to lookup</a>
    <div id="status-message" class="message-panel" role="status">Looking up your print…</div>
    <noscript><p class="error">Please enable JavaScript to look up your print.</p></noscript>
    <article id="order" hidden>
      <div class="status-heading"><div><p class="eyebrow">YOUR CREATION, ONE STEP CLOSER</p><h1>Your print.<br><span class="accent">The latest.</span></h1></div><div class="order-number"><span class="eyebrow">CONFIRMATION NUMBER</span><strong id="order-code"></strong></div></div>
      <div class="status-grid">
        <section class="detail-card"><p class="eyebrow">PRINT STATUS</p><div id="status-badge" class="status-badge"></div><h2 id="print-name"></h2><p id="status-detail" class="muted"></p><ol id="timeline" class="timeline" aria-label="Print progress"></ol></section>
        <section class="detail-card arrival-card"><div class="card-top"><p class="eyebrow" id="fulfillment-label"></p><span class="mini-icon" aria-hidden="true">↗</span></div><h2 id="ready-time"></h2><p class="muted" id="fulfillment-note"></p><div class="owner-note"><p class="eyebrow">A NOTE FROM ROBINSON</p><p id="order-note"></p></div></section>
      </div>
      <div class="update-row"><p id="updated-at" class="hint"></p><button id="refresh-button" class="secondary" type="button">Refresh status ↻</button></div>
      <p class="hint" id="refresh-message" role="status"></p>
    </article>
  </main>
  <footer><span>Robinson's 3D Printing Service</span><span>Made with care, layer by layer.</span></footer>
</body>
</html>
